<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - Receipt Scanner</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
                         "Noto Sans JP", sans-serif;
            background: #f5f7fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .logo {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            background: #fff;
            color: #333;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 0.85rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .google-btn:hover {
            border-color: #4285f4;
            background: #f8f9ff;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.15);
        }

        .google-btn svg {
            width: 20px;
            height: 20px;
        }

        .features {
            margin-top: 2.5rem;
            text-align: left;
        }

        .features h3 {
            font-size: 0.85rem;
            color: #95a5a6;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            color: #555;
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .feature-icon.scan { background: #ebf5fb; color: #3498db; }
        .feature-icon.sheet { background: #eafaf1; color: #27ae60; }
        .feature-icon.mf { background: #fef9e7; color: #f39c12; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">&#x1F4F7;</div>
        <h1>Receipt Scanner</h1>
        <p class="subtitle">
            レシートを撮影するだけで<br>
            スプレッドシート保存 & MoneyForward連携
        </p>

        <a href="/auth/google" class="google-btn">
            <svg viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Googleでログイン
        </a>

        <div class="features">
            <h3>Features</h3>
            <div class="feature-item">
                <div class="feature-icon scan">&#x1F4CB;</div>
                <span>Google Cloud VisionでレシートをOCR解析</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon sheet">&#x1F4CA;</div>
                <span>Google Sheetsに自動でデータ保存</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon mf">&#x1F4B0;</div>
                <span>MoneyForward MEに家計簿データ連携</span>
            </div>
        </div>
    </div>
</body>
</html>
